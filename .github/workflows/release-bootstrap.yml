name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Initial version without the v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt devscripts dash
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - run: uv run python scripts/validate_skills.py
      - run: sh scripts/check-shell.sh
      - name: Trivy release gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: .git,.venv,dist
          trivyignores: .trivyignore
          format: table
      - run: bash scripts/build-release.sh
      - run: cp CHANGELOG.md dist/CHANGELOG.md
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from open_claude_design import __version__; print(__version__)')"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
      - name: Smoke-test built installer
        env:
          OPEN_CLAUDE_DESIGN_SKIP_LOGIN: "1"
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/open-claude-design-bin
          UV_TOOL_DIR: ${{ runner.temp }}/open-claude-design-tools
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          export OPEN_CLAUDE_DESIGN_PACKAGE
          OPEN_CLAUDE_DESIGN_PACKAGE="$(find dist -maxdepth 1 -name 'open_claude_design-*-py3-none-any.whl' -print -quit)"
          sh dist/install.sh --agents=claude-code,codex,opencode --scope=global --yes
          open-claude-design doctor --agents=claude-code,codex,opencode --scope=global --offline --json
          sh dist/uninstall.sh --yes
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/uninstall.sh
            dist/open-claude-design.tar.gz
            dist/open_claude_design-*.whl
            dist/SHA256SUMS
            dist/CHANGELOG.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-claude-design-bootstrap-${{ inputs.version }}
          path: |
            dist/install.sh
            dist/uninstall.sh
            dist/open-claude-design.tar.gz
            dist/open_claude_design-*.whl
            dist/SHA256SUMS
            dist/CHANGELOG.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: open-claude-design-bootstrap-${{ inputs.version }}
          path: dist
      - name: Create and publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" \
            dist/install.sh \
            dist/uninstall.sh \
            dist/open-claude-design.tar.gz \
            dist/open_claude_design-*.whl \
            dist/SHA256SUMS \
            --draft \
            --notes-file dist/CHANGELOG.md \
            --title "Open Claude Design v$RELEASE_VERSION"
          gh release edit "v$RELEASE_VERSION" --draft=false
