name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install shell QA tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt devscripts dash
      - name: Install shell QA tools on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt dash-shell checkbashisms
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run python scripts/validate_skills.py
      - run: sh scripts/check-shell.sh
      - run: bash scripts/build-release.sh
      - name: Smoke-test release archive
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/open-claude-design-bin
          UV_TOOL_DIR: ${{ runner.temp }}/open-claude-design-tools
          OPEN_CLAUDE_DESIGN_SKIP_LOGIN: "1"
        run: |
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          export OPEN_CLAUDE_DESIGN_PACKAGE
          OPEN_CLAUDE_DESIGN_PACKAGE="$(find dist -maxdepth 1 -name 'open_claude_design-*-py3-none-any.whl' -print -quit)"
          sh install.sh --agents=claude-code,codex,opencode,cursor,kiro-cli,pi --scope=global --yes
          open-claude-design doctor --agents=claude-code,codex,opencode,cursor,kiro-cli,pi --scope=global --offline --json
          sh uninstall.sh --yes

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-claude-design-release
          path: |
            dist/install.sh
            dist/uninstall.sh
            dist/open-claude-design.tar.gz
            dist/open_claude_design-*.whl
            dist/SHA256SUMS
